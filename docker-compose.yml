version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: blog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpassword
      POSTGRES_DB: techblog
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - blog_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloguser -d techblog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: blog_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - blog_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog_backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://bloguser:blogpassword@postgres:5432/techblog
      # Vector DB
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # LLM
      LLM_MODEL_PATH: /models/gemma2-9b
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
      # App settings
      APP_ENV: development
      DEBUG: "true"
      CORS_ORIGINS: http://localhost:3777,http://frontend:3777
      # File upload
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 104857600  # 100MB
    volumes:
      - ./backend:/app
      - /mnt/storage/models:/models:ro  # Local LLM models (read-only)
      - backend_uploads:/app/uploads
    ports:
      - "8777:8777"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - blog_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8777 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8777/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8777
    container_name: blog_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8777
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Anonymous volume for node_modules
    ports:
      - "3777:3777"
    depends_on:
      - backend
    networks:
      - blog_network
    command: npm run dev -- --host 0.0.0.0 --port 3777
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3777"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: blog_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@techblog.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - blog_network
    profiles:
      - tools  # Only start with: docker-compose --profile tools up

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  backend_uploads:
    driver: local
  pgadmin_data:
    driver: local

networks:
  blog_network:
    driver: bridge
